<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        .loader{
            height: 100px;
            width: 100px;
            border: 3px solid #ddd;
            border-top-color: blue;
            border-radius: 50%;
            animation: samp 2s linear infinite;
        }

        @keyframes samp {
            from{
                transform: rotate(0deg);

            }
            100%{
                transform: rotate(360deg);
            }
            
        }
    </style>

    
</body>
<div class="loader">

</div>

</html>
