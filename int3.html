<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS potsition</title>
</head>
<body>
    <style>
        .box{
            background-color: rgb(43, 8, 172);
            height: 200px;
            width: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 30px;
        }

        .lower-box{
            background-color: rgb(83, 83,211);
            height: 200px;
            width: 300px;
            display: flex;

        }
        







        #box-1{
            position:static;
        }
        #box-2{
            position:relative;
            right: 0px;
        }
        #box-3{
            position:absolute;
        }

    </style>
    <div class="parent">
        <div id="box-1" class="box"></div>
        <div id="box-2" class="box"></div>
        <div id="box-3" class="box"></div>
        <div id="box-4" class="box"></div>
    </div>
</body>
</html>
