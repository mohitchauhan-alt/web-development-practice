<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    body {
    font-family:Arial, Helvetica, sans-serif;
    background-color: white;
    margin: 0;
    padding: 30px;
}

form {
    background-color: rgb(181, 200, 223);
    width: 600px;
    margin: auto;
    padding: 25px;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.15);
}

h1 {
    text-align: center;
    color: black;
}

h2 {
    color:grey;
    border-bottom: 1px solid whitesmoke;
    padding-bottom: 5px;
    margin-top: 25px;
}

label {
    font-size: 15px;
    color: black;
}

input[type="text"],
input[type="email"],
input[type="tel"],
input[type="date"],
input[type="password"],
select,
textarea {
    width: 100%;
    padding: 10px;
    margin-top: 6px;
    border: 1px solid rgb(204, 191, 191);
    border-radius: 4px;
    box-sizing: border-box;
}

input[type="radio"],
input[type="checkbox"] {
    margin-right: 5px;
}

input[type="file"] {
    margin-top: 8px;
}

textarea {
    resize: vertical;
}

input[type="submit"],
input[type="reset"] {
    padding: 10px 20px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    margin-right:10px ;
}

input[type="submit"] {
    background-color: rgb(58, 82, 216);
    color: white;
}

input[type="reset"] {
    background-color: #5e5858;
    color: grey;
}

input[type="submit"]:hover {
    background-color: rgb(24, 196, 76);
}

input[type="reset"]:hover {
    background-color: rgb(153, 151, 151);
}
    </style>
</head>
<body>
    <h1>Internship Application Form</h1>
    <form>
        <h2>Personal Details</h2>

        <label for="fullname">Full Name:</label>
        <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required><br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required><br><br>
        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required><br><br>
        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob" required><br><br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required><br><br>

        <h2>Gender</h2>

        <input type="radio" id="male" name="gender" value="Male" required>
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>
        <input type="radio" id="other" name="gender" value="Other">
        <label for="other">Other</label><br><br>

        <h2>Educational Details</h2>

        <label for="course">Course:</label>
        <select id="course" name="course" required>
            <option value="">Select your course</option>
            <option value="CSE">CSE</option>
            <option value="IT">IT</option>
            <option value="ECE">ECE</option>
            <option value="Mechanical">Mechanical</option>
        </select><br><br>

        <h2>Skills</h2>

        <input type="checkbox" id="java" name="skills" value="Java">
        <label for="java">Java</label>
        <input type="checkbox" id="javascript" name="skills" value="JavaScript">
        <label for="javascript">JavaScript</label>
        <input type="checkbox" id="html" name="skills" value="HTML">
        <label for="html">HTML</label>
        <input type="checkbox" id="css" name="skills" value="CSS">
        <label for="css">CSS</label>
        <input type="checkbox" id="react" name="skills" value="React">
        <label for="react">React</label><br><br>

        <h2>Internship Preference</h2>

        <input type="radio" id="fulltime" name="internship" value="Full Time" required>
        <label for="fulltime">Full Time</label>
        <input type="radio" id="parttime" name="internship" value="Part Time">
        <label for="parttime">Part Time</label>
        <input type="radio" id="remote" name="internship" value="Remote">
        <label for="remote">Remote</label><br><br>
        <h2>Application Details</h2>
        <label for="resume">Upload Resume:</label>
        <input type="file" id="resume" name="resume" required>
        <br><br>
        <label for="coverletter">Cover Letter:</label><br>
        <textarea id="coverletter" name="coverletter" rows="8" cols="50"
                  placeholder="Write your cover letter here..." required></textarea><br><br>
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
    </form>
</body>
</html>
