```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Animated Login Form</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            overflow: hidden;
        }

        /* Background circles */

        .circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            animation: move 6s infinite alternate;
        }

        .circle:nth-child(1) {
            width: 200px;
            height: 200px;
            top: 10%;
            left: 10%;
        }

        .circle:nth-child(2) {
            width: 300px;
            height: 300px;
            bottom: 5%;
            right: 10%;
            animation-delay: 2s;
        }

        @keyframes move {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(-40px);
            }
        }

        /* Login Box */

        .login-box {
            position: relative;
            width: 350px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
            animation: appear 1s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(50px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-box h2 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            font-size: 30px;
        }

        /* Input */

        .input-box {
            margin-bottom: 20px;
        }

        .input-box input {
            width: 100%;
            padding: 13px 15px;
            border: none;
            outline: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.9);
            font-size: 15px;
            transition: 0.3s;
        }

        .input-box input:focus {
            transform: scale(1.03);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.7);
        }

        /* Button */

        .login-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: white;
            color: #667eea;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover {
            transform: scale(1.05);
            background: #667eea;
            color: white;
        }

        /* Extra text */

        .forgot {
            text-align: right;
            margin: 10px 0 20px;
        }

        .forgot a {
            color: white;
            text-decoration: none;
            font-size: 13px;
        }

        .forgot a:hover {
            text-decoration: underline;
        }

        .signup {
            text-align: center;
            color: white;
            margin-top: 20px;
            font-size: 14px;
        }

        .signup a {
            color: white;
            font-weight: bold;
            text-decoration: none;
        }

        .signup a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <!-- Animated Background -->

    <div class="circle"></div>
    <div class="circle"></div>

    <!-- Login Form -->

    <div class="login-box">

        <h2>Login</h2>

        <form>

            <div class="input-box">
                <input type="text" placeholder="Username" required>
            </div>

            <div class="input-box">
                <input type="password" placeholder="Password" required>
            </div>

            <div class="forgot">
                <a href="#">Forgot Password?</a>
            </div>

            <button type="submit" class="login-btn">
                Login
            </button>

            <div class="signup">
                Don't have an account?
                <a href="#">Sign Up</a>
            </div>

        </form>

    </div>

</body>

</html>
```
