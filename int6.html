<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        body{
            background-color: gray;
        }

        .card-container{
            height:300px;
            width: 200px;
            overflow: hidden;
            margin: 20px;
            border-radius: 10px;
            border: 1px solid #ccc;
        }
        #image{
            height: 70%;
            width: 100%;
            object-fit: cover;
        }
        img{
            height: 100%;
            width: 100%;
        }
        #description{
            height: 30%;
            width: 100%;
            background-color: #f5f5f5;
            padding: 10px;
        }
        .card-container:hover{
            box-shadow: 0px 0px 10px #ccc;
            transition: all 0.3s ease-in-out;
            scale: 1.08;
        }
        #container{
            display: flex;
            align-items: center;
            flex-wrap: wrap;
        }
        p{
            font-size: 14px;
            color: #666;
        }

        

    </style>
</head>
<body>
   <div id ="container">
     <div class="card-container">
       <div id="image"><img src="image.png"></div>
       <div id="description">
           <h3>Hanuman Ansh</h3><br>
           <p> U | Hindi</p>
       </div>

     </div>
