<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Internship Application Form</title>
</head>
<body>

    <h1>Internship Application Form</h1>

    <form>

        <h2>Personal Details</h2>

        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name"
               placeholder="Enter your full name" required>
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email"
               placeholder="Enter your email" required>
        <br><br>

        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone"
               placeholder="Enter your phone number" required>
        <br><br>

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob" required>
        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password"
               placeholder="Enter password" required>

        <br><br>

        <label>Gender:</label>

        <input type="radio" id="male" name="gender" value="Male" required>
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>

        <input type="radio" id="other" name="gender" value="Other">
        <label for="other">Other</label>

        <h2>Educational Details</h2>

        <label for="course">Course:</label>

        <select id="course" name="course" required>
            <option value="">Select Course</option>
            <option value="CSE">CSE</option>
            <option value="IT">IT</option>
            <option value="ECE">ECE</option>
            <option value="Mechanical">Mechanical</option>
        </select>

        <br><br>

        <label>Skills:</label><br>

        <input type="checkbox" id="java" name="skills" value="Java">
        <label for="java">Java</label><br>

        <input type="checkbox" id="javascript" name="skills" value="JavaScript">
        <label for="javascript">JavaScript</label><br>

        <input type="checkbox" id="html" name="skills" value="HTML">
        <label for="html">HTML</label><br>

        <input type="checkbox" id="css" name="skills" value="CSS">
        <label for="css">CSS</label><br>

        <input type="checkbox" id="react" name="skills" value="React">
        <label for="react">React</label>

        <h2>Internship Details</h2>

        <label>Internship Preference:</label>

        <input type="radio" id="remote" name="preference" value="Remote" required>
        <label for="remote">Remote</label>

        <input type="radio" id="onsite" name="preference" value="Onsite">
        <label for="onsite">Onsite</label>

        <input type="radio" id="hybrid" name="preference" value="Hybrid">
        <label for="hybrid">Hybrid</label>

        <br><br>

        <label for="resume">Resume:</label>
        <input type="file" id="resume" name="resume"
               accept=".pdf,.doc,.docx" required>

        <br><br>

        <label for="cover">Cover Letter:</label><br>
        <textarea id="cover" name="cover"
                  rows="6" cols="50"
                  placeholder="Write your cover letter..."
                  required></textarea>

        <br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">

    </form>

</body>
</html>
